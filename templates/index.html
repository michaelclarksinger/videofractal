<!DOCTYPE html>
<html>
<head>
    <title>Video Fractal Processor</title>
</head>
<body>
    <h1>Video Fractal Processor</h1>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        <label>Video File:</label>
        <input type="file" name="video" accept="video/*" required><br>
        <label>Effect:</label>
        <select name="effect">
            <option value="kaleidoscope">Kaleidoscope</option>
            <option value="mirror">Mirror</option>
        </select><br>
        <label>Segments (for kaleidoscope):</label>
        <input type="number" name="segments" value="6" min="2" max="12"><br>
        <label>Speed:</label>
        <input type="number" step="0.1" name="speed" value="1.0" min="0.1" max="4"><br>
        <button type="submit">Process</button>
    </form>

    {% if filename %}
    <h2>Processed Video</h2>
    <video width="480" controls>
        <source src="{{ url_for('download_file', filename=filename) }}" type="video/mp4">
    </video>
    <p><a href="{{ url_for('download_file', filename=filename) }}">Download processed video</a></p>
    {% endif %}
</body>
</html>
